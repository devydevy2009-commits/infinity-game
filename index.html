<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Infinity</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="score">Score: 0</div>
    <div id="lives">Lives: 3</div>
    <div id="timer">Time: 0:00</div>
    <div id="power">Power: 1</div>
    <button id="startBtn" type="button">Start</button>
    <button id="settingsBtn" type="button" aria-label="Menu">⚙︎</button>
  </div>
  <div id="settingsMenu" class="hidden" role="dialog" aria-modal="true">
    <div class="menu-content">
      <h2>Infinity</h2>
      <button id="newGameBtn" type="button">New Game</button>
      <button id="pauseBtn" type="button">Pause</button>
      <button id="resumeBtn" class="hidden" type="button">Resume</button>
      <button id="restartBtn" type="button">Restart Game</button>
      <button id="installBtn" class="hidden" type="button">Installa app</button>
      <button id="iosInstallBtn" type="button">Aggiungi a Home</button>
      <button id="refreshBtn" type="button">Aggiorna app</button>
      <button id="closeSettingsBtn" type="button">Close</button>
    </div>
  </div>
  <div id="iosInstallHelp" class="hidden" role="dialog" aria-modal="true">
    <div class="menu-content install-help">
      <h2>Aggiungi Infinity</h2>
      <p>In Safari, tocca <strong>Condividi</strong> (quadrato con freccia verso l’alto), scorri le azioni e scegli <strong>Aggiungi a Home</strong>.</p>
      <button id="closeIosInstallHelpBtn" type="button">Ho capito</button>
    </div>
  </div>
  <div id="pauseOverlay" class="hidden">
    <div class="pause-content">
      <h2>PAUSED</h2>
      <button id="resumeFromPauseBtn" type="button">Resume</button>
      <button id="restartFromPauseBtn" type="button">Restart</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
