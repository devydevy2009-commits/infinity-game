name: Infinity syntax check

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check game.js
      - run: node --check tactical_balance.js
